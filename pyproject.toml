[project]
name = "decker"
version = "1.0.0"
description = "Build an Anki deck that teaches the language of a source text"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.1",
    "ipython>=9.16.1",
    "ollama>=0.6.2",
    "stanza>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/NotBru/decker"

[project.scripts]
decker = "decker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decker"]
